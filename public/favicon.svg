<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Forum Gradient Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b071e"/>
      <stop offset="50%" stop-color="#140d33"/>
      <stop offset="100%" stop-color="#1f144a"/>
    </linearGradient>

    <!-- Pro Bubble Gradient (Emerald/Teal) -->
    <linearGradient id="proGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Con Bubble Gradient (Coral/Rose) -->
    <linearGradient id="conGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Gold Pillar / Axis Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Gold Accent Border -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.5"/>

  <!-- Classical Greek Agora Pillar Axis (Center) -->
  <g opacity="0.35">
    <rect x="246" y="90" width="20" height="330" rx="6" fill="url(#goldGrad)"/>
    <path d="M 220 90 H 292 M 230 110 H 282 M 220 420 H 292 M 230 400 H 282" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Left Bubble: PRO Argument (Top-Left) -->
  <g filter="url(#softGlow)">
    <path d="M 100 130 H 260 C 290 130 310 150 310 180 V 240 C 310 270 290 290 260 290 H 160 L 110 330 V 290 H 100 C 70 290 50 270 50 240 V 180 C 50 150 70 130 100 130 Z" fill="url(#proGrad)"/>
    <!-- Pro Symbol (+) -->
    <path d="M 180 185 V 235 M 155 210 H 205" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Right Bubble: CON Argument (Bottom-Right) -->
  <g filter="url(#softGlow)">
    <path d="M 412 382 H 252 C 222 382 202 362 202 332 V 272 C 202 242 222 222 252 222 H 352 L 402 182 V 222 H 412 C 442 222 462 242 462 272 V 332 C 462 362 442 382 412 382 Z" fill="url(#conGrad)"/>
    <!-- Con Symbol (-) -->
    <path d="M 307 302 H 357" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Center Consensus Spark / Balance Scales Motif -->
  <circle cx="256" cy="256" r="32" fill="#140d33" stroke="url(#goldGrad)" stroke-width="6" filter="url(#softGlow)"/>
  <path d="M 256 236 L 262 250 L 276 256 L 262 262 L 256 276 L 250 262 L 236 256 L 250 250 Z" fill="url(#goldGrad)"/>
</svg>